name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weighing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: kh-weighing
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weighing_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks проверяет всю историю коммитов
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kh-weighing/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Тесты и порог покрытия 60 %
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=60
      - name: Поиск секретов в коде (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка Docker-образа
        run: docker build -t kh-weighing:${{ github.sha }} .
