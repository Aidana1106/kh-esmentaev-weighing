# Настройки линтера для CI (ЛЗ 10)
target-version = "py312"
line-length = 120

[lint]
# E/W – стиль, F – ошибки (неиспользуемые импорты и т. п.), B – типичные баги,
# UP – устаревший синтаксис, SIM – упрощения
select = ["E", "W", "F", "B", "UP", "SIM"]
# Depends(...) в аргументах – штатный приём FastAPI, не ошибка
ignore = ["B008"]
